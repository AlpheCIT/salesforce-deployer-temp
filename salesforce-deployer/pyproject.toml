[tool]
name = "salesforce-deployer"
version = "0.1.0"
description = "A tool for deploying Salesforce metadata based on JSON schema configurations."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dependencies = [
    "python-dotenv",
    "requests",
    "click",
    "pytest"
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"