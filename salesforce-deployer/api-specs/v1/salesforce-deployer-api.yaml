openapi: 3.0.3
info:
  title: Salesforce Schema Deployer API
  description: |-
    API for extracting, managing, and deploying Salesforce metadata schemas.
    This API enables seamless management of Salesforce configurations across environments.
  version: 0.1.0
  contact:
    email: your.email@example.com
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api/v1
    description: Development server
  - url: http://localhost:8001/api/v1
    description: Mock server for testing

tags:
  - name: authentication
    description: Authentication operations
  - name: schemas
    description: Schema extraction and management
  - name: deployment
    description: Salesforce deployment operations
  - name: metadata
    description: Metadata component management
  - name: validation
    description: Schema validation operations
  - name: organizations
    description: Salesforce organization management

paths:
  /auth/login:
    post:
      tags:
        - authentication
      summary: Authenticate with Salesforce credentials
      description: Authenticates a user with their Salesforce username, password, and optional security token to obtain an access token for API access.
      operationId: authenticateWithCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/oauth:
    post:
      tags:
        - authentication
      summary: Authenticate using OAuth 2.0
      description: Authenticates using the OAuth 2.0 protocol, supporting both web server flow (with auth code) and username-password flow for headless integrations.
      operationId: authenticateWithOAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - authentication
      summary: Refresh authentication token
      description: Obtains a new access token using a valid refresh token when the current token has expired or is about to expire.
      operationId: refreshToken
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /schemas/extract:
    post:
      tags:
        - schemas
      summary: Extract schema from a Salesforce organization
      description: Extracts metadata schema components from a specified Salesforce organization, with options to filter by component types and include standard or managed components.
      operationId: extractSchema
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaExtractionRequest'
      responses:
        '200':
          description: Schema extraction successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaExtractionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /schemas/{schemaId}:
    get:
      tags:
        - schemas
      summary: Get schema by ID
      description: Retrieves the complete metadata schema definition by its unique identifier, including all component definitions and relationships.
      operationId: getSchema
      security:
        - BearerAuth: []
      parameters:
        - name: schemaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Schema found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '404':
          description: Schema not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - schemas
      summary: Update schema by ID
      description: Updates an existing schema definition with new metadata components, properties, or relationships while preserving its identifier.
      operationId: updateSchema
      security:
        - BearerAuth: []
      parameters:
        - name: schemaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schema'
      responses:
        '200':
          description: Schema updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Schema not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - schemas
      summary: Delete schema by ID
      description: Permanently removes a schema definition and all its associated metadata components from the system.
      operationId: deleteSchema
      security:
        - BearerAuth: []
      parameters:
        - name: schemaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Schema deleted successfully
        '404':
          description: Schema not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /schemas/compare:
    post:
      tags:
        - schemas
      summary: Compare two schemas
      description: Performs a detailed comparison between two schemas, identifying added, modified, and removed components with field-level change tracking.
      operationId: compareSchemas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaComparisonRequest'
      responses:
        '200':
          description: Schema comparison completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaComparisonResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /schemas/validate:
    post:
      tags:
        - validation
      summary: Validate a schema
      description: Analyzes a schema for validity, checking component dependencies, references, and compatibility with target Salesforce organizations.
      operationId: validateSchema
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaValidationRequest'
      responses:
        '200':
          description: Schema validation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaValidationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deployments:
    post:
      tags:
        - deployment
      summary: Deploy schema to a Salesforce organization
      description: Initiates a deployment process to apply schema changes to a target Salesforce organization with configurable validation and rollback options.
      operationId: deploySchema
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentRequest'
      responses:
        '202':
          description: Deployment started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deployments/{deploymentId}:
    get:
      tags:
        - deployment
      summary: Get deployment status by ID
      description: Retrieves the current status, progress, and results of an ongoing or completed deployment operation.
      operationId: getDeploymentStatus
      security:
        - BearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment status found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentStatus'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deployments/{deploymentId}/cancel:
    post:
      tags:
        - deployment
      summary: Cancel a deployment
      description: Attempts to cancel an in-progress deployment operation, rolling back any changes if possible based on the deployment phase.
      operationId: cancelDeployment
      security:
        - BearerAuth: []
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentStatus'
        '400':
          description: Deployment cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metadata/objects:
    get:
      tags:
        - metadata
      summary: Get a list of objects
      description: Retrieves a list of all available objects from either a stored schema or directly from a connected Salesforce organization.
      operationId: getObjects
      security:
        - BearerAuth: []
      parameters:
        - name: schemaId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID of the schema to get objects from. If not provided, objects from the connected Salesforce org will be returned.
      responses:
        '200':
          description: List of objects retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectMetadata'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metadata/objects/{objectName}:
    get:
      tags:
        - metadata
      summary: Get object details by name
      description: Fetches comprehensive metadata for a specific object, including its fields, relationships, and configuration properties.
      operationId: getObjectByName
      security:
        - BearerAuth: []
      parameters:
        - name: objectName
          in: path
          required: true
          schema:
            type: string
        - name: schemaId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID of the schema to get the object from. If not provided, the object from the connected Salesforce org will be returned.
      responses:
        '200':
          description: Object details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
        '404':
          description: Object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metadata/objects/{objectName}/fields:
    get:
      tags:
        - metadata
      summary: Get fields for an object
      description: Returns a list of all fields defined for a specific object, with their data types, validation rules, and relationships.
      operationId: getObjectFields
      security:
        - BearerAuth: []
      parameters:
        - name: objectName
          in: path
          required: true
          schema:
            type: string
        - name: schemaId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: ID of the schema to get fields from. If not provided, fields from the connected Salesforce org will be returned.
      responses:
        '200':
          description: Fields retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldMetadata'
        '404':
          description: Object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations:
    get:
      tags:
        - organizations
      summary: Get a list of connected Salesforce organizations
      description: Retrieves all Salesforce organizations that have been configured for schema extraction and deployment operations.
      operationId: getOrganizations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of organizations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - organizations
      summary: Add a new Salesforce organization
      description: Registers a new Salesforce organization with the system, including connection credentials and organization metadata.
      operationId: addOrganization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
      responses:
        '201':
          description: Organization added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{orgId}:
    get:
      tags:
        - organizations
      summary: Get organization details by ID
      description: Retrieves detailed information about a specific Salesforce organization, including its connection status and metadata.
      operationId: getOrganizationById
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - organizations
      summary: Update organization details
      description: Updates the configuration, credentials, or metadata for an existing Salesforce organization connection.
      operationId: updateOrganization
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - organizations
      summary: Delete organization
      description: Removes a Salesforce organization from the system, including all stored credentials and connection information.
      operationId: deleteOrganization
      security:
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Organization deleted successfully
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Salesforce username
          example: user@example.com
        password:
          type: string
          description: Salesforce password
          format: password
          example: myPassword123
        securityToken:
          type: string
          description: Salesforce security token
          example: ABCDEFGHIJKLMNOP
        instanceUrl:
          type: string
          description: Salesforce instance URL
          example: https://login.salesforce.com

    OAuthRequest:
      type: object
      required:
        - clientId
        - clientSecret
      properties:
        clientId:
          type: string
          description: OAuth client ID
          example: 3MVG9e2mBbZnmcolVXiRm8YNot7VI5W_oiqJuBDdDUNF9s45MfoiV2h_nI2paMT1QA_yw3UxQncI7Goz8L1A7
        clientSecret:
          type: string
          description: OAuth client secret
          example: "123456789012345678"  # Add quotes to make it a string
        redirectUri:
          type: string
          description: OAuth redirect URI
          example: https://localhost:8000/callback
        authCode:
          type: string
          description: OAuth authorization code (required if not using username/password flow)
          example: aPrxJZTWTs65VeNEEhYht92nXyz
        username:
          type: string
          description: Salesforce username (required if using username/password flow)
          example: user@example.com
        password:
          type: string
          description: Salesforce password (required if using username/password flow)
          format: password
          example: myPassword123

    AuthenticationResponse:
      type: object
      required:
        - accessToken
        - instanceUrl
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: JWT refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        instanceUrl:
          type: string
          description: Salesforce instance URL
          example: https://na1.salesforce.com
        expiresIn:
          type: integer
          description: Token expiration time in seconds
          example: 3600

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: INVALID_SESSION_ID
        message:
          type: string
          description: Error message
          example: Session expired or invalid
        details:
          type: array
          description: Detailed error information
          items:
            type: object
            properties:
              field:
                type: string
                example: username
              message:
                type: string
                example: Field is required

    SchemaExtractionRequest:
      type: object
      required:
        - orgId
      properties:
        orgId:
          type: string
          format: uuid
          description: ID of the organization to extract schema from
          example: 123e4567-e89b-12d3-a456-426614174000
        components:
          type: array
          description: List of components to extract. If not provided, all components will be extracted.
          items:
            type: string
            enum:
              - objects
              - fields
              - workflows
              - dashboards
              - flows
            example: objects
        includeStandard:
          type: boolean
          description: Whether to include standard objects
          default: false
        includeManaged:
          type: boolean
          description: Whether to include managed package components
          default: false
        filter:
          type: string
          description: Filter expression to limit extracted components
          example: "CustomObject:Account,Contact"

    SchemaExtractionResponse:
      type: object
      required:
        - schemaId
        - status
      properties:
        schemaId:
          type: string
          format: uuid
          description: ID of the extracted schema
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          enum:
            - completed
            - in_progress
            - failed
          description: Status of the extraction process
          example: completed
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Progress percentage
          example: 100
        message:
          type: string
          description: Additional information
          example: Schema extraction completed successfully
        stats:
          type: object
          properties:
            objects:
              type: integer
              description: Number of objects extracted
              example: 10
            fields:
              type: integer
              description: Number of fields extracted
              example: 50
            workflows:
              type: integer
              description: Number of workflow rules extracted
              example: 5
            dashboards:
              type: integer
              description: Number of dashboards extracted
              example: 3
            flows:
              type: integer
              description: Number of flows extracted
              example: 2

    Schema:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Schema ID
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: Schema name
          example: Production Schema April 2025
        description:
          type: string
          description: Schema description
          example: Current production schema as of April 2025
        createdAt:
          type: string
          format: date-time
          description: Schema creation timestamp
          example: 2025-04-21T14:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: Schema last update timestamp
          example: 2025-04-21T14:30:00Z
        sourceOrgId:
          type: string
          format: uuid
          description: ID of the source organization
          example: 123e4567-e89b-12d3-a456-426614174000
        apiVersion:
          type: string
          description: Salesforce API version
          example: "56.0"  # Add quotes to make it a string
        components:
          type: object
          properties:
            objects:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ObjectMetadata'
            workflowRules:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/WorkflowMetadata'
            dashboards:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/DashboardMetadata'
            flows:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/FlowMetadata'

    SchemaComparisonRequest:
      type: object
      required:
        - sourceSchemaId
        - targetSchemaId
      properties:
        sourceSchemaId:
          type: string
          format: uuid
          description: ID of the source schema
          example: 123e4567-e89b-12d3-a456-426614174000
        targetSchemaId:
          type: string
          format: uuid
          description: ID of the target schema
          example: 223e4567-e89b-12d3-a456-426614174000
        components:
          type: array
          description: List of components to compare. If not provided, all components will be compared.
          items:
            type: string
            enum:
              - objects
              - fields
              - workflows
              - dashboards
              - flows
            example: objects

    SchemaComparisonResponse:
      type: object
      required:
        - differences
      properties:
        differences:
          type: array
          items:
            type: object
            required:
              - componentType
              - componentName
              - changeType
            properties:
              componentType:
                type: string
                enum:
                  - object
                  - field
                  - workflow
                  - dashboard
                  - flow
                example: field
              componentName:
                type: string
                example: Account.CustomField__c
              changeType:
                type: string
                enum:
                  - added
                  - removed
                  - modified
                example: modified
              sourcePath:
                type: string
                example: objects.Account.fields.CustomField__c
              targetPath:
                type: string
                example: objects.Account.fields.CustomField__c
              sourceValue:
                type: object
                description: Component value in the source schema
              targetValue:
                type: object
                description: Component value in the target schema
              fieldChanges:
                type: array
                description: Field-level changes (for modified components)
                items:
                  type: object
                  required:
                    - field
                    - changeType
                  properties:
                    field:
                      type: string
                      example: length
                    changeType:
                      type: string
                      enum:
                        - added
                        - removed
                        - modified
                      example: modified
                    sourceValue:
                      type: object
                      example: { "length": 80 }  # Format as object
                    targetValue:
                      type: object
                      example: { "length": 255 }  # Format as object

    SchemaValidationRequest:
      type: object
      properties:
        schema:
          $ref: '#/components/schemas/Schema'
        schemaId:
          type: string
          format: uuid
          description: ID of the schema to validate (alternative to providing the full schema)
          example: 123e4567-e89b-12d3-a456-426614174000
        targetOrgId:
          type: string
          format: uuid
          description: ID of the target organization to validate against (optional)
          example: 223e4567-e89b-12d3-a456-426614174000
        checkDependencies:
          type: boolean
          description: Whether to check dependencies
          default: true
        strictValidation:
          type: boolean
          description: Whether to perform strict validation
          default: false

    SchemaValidationResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
          description: Whether the schema is valid
          example: true
        errors:
          type: array
          description: Validation errors (if any)
          items:
            $ref: '#/components/schemas/ValidationError'
        warnings:
          type: array
          description: Validation warnings
          items:
            $ref: '#/components/schemas/ValidationError'
        dependencyGraph:
          type: object
          description: Graph of component dependencies
          additionalProperties:
            type: array
            items:
              type: string

    DeploymentRequest:
      type: object
      required:
        - targetOrgId
      properties:
        schemaId:
          type: string
          format: uuid
          description: ID of the schema to deploy
          example: 123e4567-e89b-12d3-a456-426614174000
        schema:
          $ref: '#/components/schemas/Schema'
        targetOrgId:
          type: string
          format: uuid
          description: ID of the target organization
          example: 223e4567-e89b-12d3-a456-426614174000
        components:
          type: array
          description: List of components to deploy. If not provided, all components will be deployed.
          items:
            type: string
            example: Account.CustomField__c
        options:
          type: object
          properties:
            checkOnly:
              type: boolean
              description: Validate but don't deploy
              default: false
            ignoreWarnings:
              type: boolean
              description: Ignore validation warnings
              default: false
            runTests:
              type: boolean
              description: Run specified tests
              default: false
            testLevel:
              type: string
              enum:
                - NoTestRun
                - RunSpecifiedTests
                - RunLocalTests
                - RunAllTestsInOrg
              default: NoTestRun
            rollbackOnError:
              type: boolean
              description: Roll back on error
              default: true
            purgeOnDelete:
              type: boolean
              description: Purge on delete
              default: false
            autoUpdatePackage:
              type: boolean
              description: Auto-update package
              default: false

    DeploymentResponse:
      type: object
      required:
        - deploymentId
        - status
      properties:
        deploymentId:
          type: string
          format: uuid
          description: Deployment ID
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          enum:
            - queued
            - in_progress
            - completed
            - failed
            - cancelled
          description: Deployment status
          example: queued
        message:
          type: string
          description: Additional information
          example: Deployment queued successfully
        validationResults:
          $ref: '#/components/schemas/SchemaValidationResponse'

    DeploymentStatus:
      type: object
      required:
        - deploymentId
        - status
      properties:
        deploymentId:
          type: string
          format: uuid
          description: Deployment ID
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          enum:
            - queued
            - in_progress
            - completed
            - failed
            - cancelled
          description: Deployment status
          example: in_progress
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Progress percentage
          example: 75
        startTime:
          type: string
          format: date-time
          description: Deployment start time
          example: 2025-04-21T14:30:00Z
        endTime:
          type: string
          format: date-time
          description: Deployment end time
          example: 2025-04-21T14:35:00Z
        message:
          type: string
          description: Additional information
          example: Deployment in progress
        results:
          type: object
          properties:
            success:
              type: boolean
              description: Whether the deployment was successful
              example: true
            completedDate:
              type: string
              format: date-time
              description: Completion timestamp
              example: 2025-04-21T14:35:00Z
            componentFailures:
              type: array
              items:
                $ref: '#/components/schemas/ComponentResult'
            componentSuccesses:
              type: array
              items:
                $ref: '#/components/schemas/ComponentResult'
            componentErrors:
              type: array
              items:
                $ref: '#/components/schemas/ComponentResult'
            apexTestResults:
              type: array
              items:
                $ref: '#/components/schemas/ApexTestResult'

