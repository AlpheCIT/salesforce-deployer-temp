openapi: 3.0.3
info:
  contact:
    email: your.email@example.com
  description: |-
    API for extracting, managing, and deploying Salesforce metadata schemas.
    This API enables seamless management of Salesforce configurations across environments.
  license:
    name: MIT
  title: Salesforce Schema Deployer API
  version: 0.1.0
servers:
- description: Development server
  url: http://localhost:8000/api/v1
- description: Mock server for testing
  url: http://localhost:8001/api/v1
tags:
- description: Authentication operations
  name: authentication
- description: Schema extraction and management
  name: schemas
- description: Salesforce deployment operations
  name: deployment
- description: Metadata component management
  name: metadata
- description: Schema validation operations
  name: validation
- description: Salesforce organization management
  name: organizations
paths:
  /auth/login:
    post:
      description: "Authenticates a user with their Salesforce username, password,\
        \ and optional security token to obtain an access token for API access."
      operationId: authenticateWithCredentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
          description: Authentication successful
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication failed
      summary: Authenticate with Salesforce credentials
      tags:
      - authentication
  /auth/oauth:
    post:
      description: "Authenticates using the OAuth 2.0 protocol, supporting both web\
        \ server flow (with auth code) and username-password flow for headless integrations."
      operationId: authenticateWithOAuth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
          description: Authentication successful
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Authentication failed
      summary: Authenticate using OAuth 2.0
      tags:
      - authentication
  /auth/refresh:
    post:
      description: Obtains a new access token using a valid refresh token when the
        current token has expired or is about to expire.
      operationId: refreshToken
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
          description: Token refreshed successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid or expired refresh token
      security:
      - BearerAuth: []
      summary: Refresh authentication token
      tags:
      - authentication
  /schemas/extract:
    post:
      description: "Extracts metadata schema components from a specified Salesforce\
        \ organization, with options to filter by component types and include standard\
        \ or managed components."
      operationId: extractSchema
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaExtractionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaExtractionResponse'
          description: Schema extraction successful
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Extract schema from a Salesforce organization
      tags:
      - schemas
  /schemas/{schemaId}:
    delete:
      description: Permanently removes a schema definition and all its associated
        metadata components from the system.
      operationId: deleteSchema
      parameters:
      - explode: false
        in: path
        name: schemaId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Schema deleted successfully
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Schema not found
      security:
      - BearerAuth: []
      summary: Delete schema by ID
      tags:
      - schemas
    get:
      description: "Retrieves the complete metadata schema definition by its unique\
        \ identifier, including all component definitions and relationships."
      operationId: getSchema
      parameters:
      - explode: false
        in: path
        name: schemaId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
          description: Schema found
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Schema not found
      security:
      - BearerAuth: []
      summary: Get schema by ID
      tags:
      - schemas
    put:
      description: "Updates an existing schema definition with new metadata components,\
        \ properties, or relationships while preserving its identifier."
      operationId: updateSchema
      parameters:
      - explode: false
        in: path
        name: schemaId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schema'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
          description: Schema updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Schema not found
      security:
      - BearerAuth: []
      summary: Update schema by ID
      tags:
      - schemas
  /schemas/compare:
    post:
      description: "Performs a detailed comparison between two schemas, identifying\
        \ added, modified, and removed components with field-level change tracking."
      operationId: compareSchemas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaComparisonRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaComparisonResponse'
          description: Schema comparison completed
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
      security:
      - BearerAuth: []
      summary: Compare two schemas
      tags:
      - schemas
  /schemas/validate:
    post:
      description: "Analyzes a schema for validity, checking component dependencies,\
        \ references, and compatibility with target Salesforce organizations."
      operationId: validateSchema
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaValidationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaValidationResponse'
          description: Schema validation completed
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
      security:
      - BearerAuth: []
      summary: Validate a schema
      tags:
      - validation
  /deployments:
    post:
      description: Initiates a deployment process to apply schema changes to a target
        Salesforce organization with configurable validation and rollback options.
      operationId: deploySchema
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
          description: Deployment started
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Deploy schema to a Salesforce organization
      tags:
      - deployment
  /deployments/{deploymentId}:
    get:
      description: "Retrieves the current status, progress, and results of an ongoing\
        \ or completed deployment operation."
      operationId: getDeploymentStatus
      parameters:
      - explode: false
        in: path
        name: deploymentId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentStatus'
          description: Deployment status found
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Deployment not found
      security:
      - BearerAuth: []
      summary: Get deployment status by ID
      tags:
      - deployment
  /deployments/{deploymentId}/cancel:
    post:
      description: "Attempts to cancel an in-progress deployment operation, rolling\
        \ back any changes if possible based on the deployment phase."
      operationId: cancelDeployment
      parameters:
      - explode: false
        in: path
        name: deploymentId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentStatus'
          description: Deployment cancelled successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Deployment cannot be cancelled
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Deployment not found
      security:
      - BearerAuth: []
      summary: Cancel a deployment
      tags:
      - deployment
  /metadata/objects:
    get:
      description: Retrieves a list of all available objects from either a stored
        schema or directly from a connected Salesforce organization.
      operationId: getObjects
      parameters:
      - description: "ID of the schema to get objects from. If not provided, objects\
          \ from the connected Salesforce org will be returned."
        explode: true
        in: query
        name: schemaId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ObjectMetadata'
                type: array
          description: List of objects retrieved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get a list of objects
      tags:
      - metadata
  /metadata/objects/{objectName}:
    get:
      description: "Fetches comprehensive metadata for a specific object, including\
        \ its fields, relationships, and configuration properties."
      operationId: getObjectByName
      parameters:
      - explode: false
        in: path
        name: objectName
        required: true
        schema:
          type: string
        style: simple
      - description: "ID of the schema to get the object from. If not provided, the\
          \ object from the connected Salesforce org will be returned."
        explode: true
        in: query
        name: schemaId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
          description: Object details retrieved successfully
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Object not found
      security:
      - BearerAuth: []
      summary: Get object details by name
      tags:
      - metadata
  /metadata/objects/{objectName}/fields:
    get:
      description: "Returns a list of all fields defined for a specific object, with\
        \ their data types, validation rules, and relationships."
      operationId: getObjectFields
      parameters:
      - explode: false
        in: path
        name: objectName
        required: true
        schema:
          type: string
        style: simple
      - description: "ID of the schema to get fields from. If not provided, fields\
          \ from the connected Salesforce org will be returned."
        explode: true
        in: query
        name: schemaId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FieldMetadata'
                type: array
          description: Fields retrieved successfully
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Object not found
      security:
      - BearerAuth: []
      summary: Get fields for an object
      tags:
      - metadata
  /organizations:
    get:
      description: Retrieves all Salesforce organizations that have been configured
        for schema extraction and deployment operations.
      operationId: getOrganizations
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Organization'
                type: array
          description: List of organizations retrieved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get a list of connected Salesforce organizations
      tags:
      - organizations
    post:
      description: "Registers a new Salesforce organization with the system, including\
        \ connection credentials and organization metadata."
      operationId: addOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Organization added successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
      security:
      - BearerAuth: []
      summary: Add a new Salesforce organization
      tags:
      - organizations
  /organizations/{orgId}:
    delete:
      description: "Removes a Salesforce organization from the system, including all\
        \ stored credentials and connection information."
      operationId: deleteOrganization
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Organization deleted successfully
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Organization not found
      security:
      - BearerAuth: []
      summary: Delete organization
      tags:
      - organizations
    get:
      description: "Retrieves detailed information about a specific Salesforce organization,\
        \ including its connection status and metadata."
      operationId: getOrganizationById
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Organization details retrieved successfully
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Organization not found
      security:
      - BearerAuth: []
      summary: Get organization details by ID
      tags:
      - organizations
    put:
      description: "Updates the configuration, credentials, or metadata for an existing\
        \ Salesforce organization connection."
      operationId: updateOrganization
      parameters:
      - explode: false
        in: path
        name: orgId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Organization updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Organization not found
      security:
      - BearerAuth: []
      summary: Update organization details
      tags:
      - organizations
components:
  schemas:
    LoginRequest:
      example:
        securityToken: ABCDEFGHIJKLMNOP
        password: myPassword123
        username: user@example.com
        instanceUrl: https://login.salesforce.com
      properties:
        username:
          description: Salesforce username
          example: user@example.com
          title: username
          type: string
        password:
          description: Salesforce password
          example: myPassword123
          format: password
          title: password
          type: string
        securityToken:
          description: Salesforce security token
          example: ABCDEFGHIJKLMNOP
          title: securityToken
          type: string
        instanceUrl:
          description: Salesforce instance URL
          example: https://login.salesforce.com
          title: instanceUrl
          type: string
      required:
      - password
      - username
      title: LoginRequest
      type: object
    OAuthRequest:
      example:
        redirectUri: https://localhost:8000/callback
        password: myPassword123
        clientId: 3MVG9e2mBbZnmcolVXiRm8YNot7VI5W_oiqJuBDdDUNF9s45MfoiV2h_nI2paMT1QA_yw3UxQncI7Goz8L1A7
        authCode: aPrxJZTWTs65VeNEEhYht92nXyz
        clientSecret: "123456789012345678"
        username: user@example.com
      properties:
        clientId:
          description: OAuth client ID
          example: 3MVG9e2mBbZnmcolVXiRm8YNot7VI5W_oiqJuBDdDUNF9s45MfoiV2h_nI2paMT1QA_yw3UxQncI7Goz8L1A7
          title: clientId
          type: string
        clientSecret:
          description: OAuth client secret
          example: "123456789012345678"
          title: clientSecret
          type: string
        redirectUri:
          description: OAuth redirect URI
          example: https://localhost:8000/callback
          title: redirectUri
          type: string
        authCode:
          description: OAuth authorization code (required if not using username/password
            flow)
          example: aPrxJZTWTs65VeNEEhYht92nXyz
          title: authCode
          type: string
        username:
          description: Salesforce username (required if using username/password flow)
          example: user@example.com
          title: username
          type: string
        password:
          description: Salesforce password (required if using username/password flow)
          example: myPassword123
          format: password
          title: password
          type: string
      required:
      - clientId
      - clientSecret
      title: OAuthRequest
      type: object
    AuthenticationResponse:
      example:
        expiresIn: 3600
        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        instanceUrl: https://na1.salesforce.com
      properties:
        accessToken:
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          title: accessToken
          type: string
        refreshToken:
          description: JWT refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          title: refreshToken
          type: string
        instanceUrl:
          description: Salesforce instance URL
          example: https://na1.salesforce.com
          title: instanceUrl
          type: string
        expiresIn:
          description: Token expiration time in seconds
          example: 3600
          title: expiresIn
          type: integer
      required:
      - accessToken
      - instanceUrl
      title: AuthenticationResponse
      type: object
    ErrorResponse:
      example:
        details:
        - field: username
          message: Field is required
        - field: username
          message: Field is required
        error: INVALID_SESSION_ID
        message: Session expired or invalid
      properties:
        error:
          description: Error code
          example: INVALID_SESSION_ID
          title: error
          type: string
        message:
          description: Error message
          example: Session expired or invalid
          title: message
          type: string
        details:
          description: Detailed error information
          items:
            $ref: '#/components/schemas/ErrorResponse_details_inner'
          title: details
          type: array
      required:
      - error
      - message
      title: ErrorResponse
      type: object
    SchemaExtractionRequest:
      example:
        includeStandard: false
        includeManaged: false
        filter: "CustomObject:Account,Contact"
        components:
        - objects
        - objects
        orgId: 123e4567-e89b-12d3-a456-426614174000
      properties:
        orgId:
          description: ID of the organization to extract schema from
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          title: orgId
          type: string
        components:
          description: "List of components to extract. If not provided, all components\
            \ will be extracted."
          items:
            enum:
            - objects
            - fields
            - workflows
            - dashboards
            - flows
            example: objects
            type: string
          title: components
          type: array
        includeStandard:
          default: false
          description: Whether to include standard objects
          title: includeStandard
          type: boolean
        includeManaged:
          default: false
          description: Whether to include managed package components
          title: includeManaged
          type: boolean
        filter:
          description: Filter expression to limit extracted components
          example: "CustomObject:Account,Contact"
          title: filter
          type: string
      required:
      - orgId
      title: SchemaExtractionRequest
      type: object
    SchemaExtractionResponse:
      example:
        stats:
          flows: 2
          objects: 10
          workflows: 5
          fields: 50
          dashboards: 3
        schemaId: 123e4567-e89b-12d3-a456-426614174000
        progress: 100
        message: Schema extraction completed successfully
        status: completed
      properties:
        schemaId:
          description: ID of the extracted schema
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          title: schemaId
          type: string
        status:
          description: Status of the extraction process
          enum:
          - completed
          - in_progress
          - failed
          example: completed
          title: status
          type: string
        progress:
          description: Progress percentage
          example: 100
          maximum: 100
          minimum: 0
          title: progress
          type: integer
        message:
          description: Additional information
          example: Schema extraction completed successfully
          title: message
          type: string
        stats:
          $ref: '#/components/schemas/SchemaExtractionResponse_stats'
      required:
      - schemaId
      - status
      title: SchemaExtractionResponse
      type: object
    Schema:
      example:
        createdAt: 2025-04-21T14:30:00Z
        components:
          workflowRules:
            key:
              criteria: Account.Status__c = 'Active'
              name: Account_Status_Update
              active: true
              description: Updates Account status based on criteria
              actions:
              - field: Status__c
                name: UpdateAccountStatus
                type: FieldUpdate
                value: Processed
              - field: Status__c
                name: UpdateAccountStatus
                type: FieldUpdate
                value: Processed
              object: Account
          flows:
            key:
              name: Lead_Process
              description: Automates lead qualification
              label: Lead Qualification Process
              processType: AutoLaunchedFlow
              triggerType: ""
              eventType: ""
              status: Active
          objects:
            key:
              custom: false
              name: Account
              description: Standard Account object
              nameField: Name
              label: Account
              fields:
                key:
                  relationshipName: ""
                  defaultValue: Default value
                  unique: false
                  name: CustomField__c
                  length: 255
                  externalId: false
                  description: A custom text field
                  formula: ""
                  label: Custom Field
                  type: Text
                  required: false
                  referenceTo: ""
              sharingModel: ReadWrite
          dashboards:
            key:
              components:
              - reportName: SalesReport
                name: SalesChart
                type: Chart
              - reportName: SalesReport
                name: SalesChart
                type: Chart
              name: Sales_Dashboard
              description: Key sales metrics dashboard
              label: Sales Performance
              folderName: Sales Dashboards
        apiVersion: "56.0"
        sourceOrgId: 123e4567-e89b-12d3-a456-426614174000
        name: Production Schema April 2025
        description: Current production schema as of April 2025
        id: 123e4567-e89b-12d3-a456-426614174000
        updatedAt: 2025-04-21T14:30:00Z
      properties:
        id:
          description: Schema ID
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          title: id
          type: string
        name:
          description: Schema name
          example: Production Schema April 2025
          title: name
          type: string
        description:
          description: Schema description
          example: Current production schema as of April 2025
          title: description
          type: string
        createdAt:
          description: Schema creation timestamp
          example: 2025-04-21T14:30:00Z
          format: date-time
          title: createdAt
          type: string
